<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Kind of Boyfriend Are You? ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 30px 15px;
  background: #26372c;
  color: #f7f0e5;
  font-family: 'Lora', serif;
}

.quiz {
  max-width: 560px;
  margin: 15px auto;
  padding: 27px 22px;
  background: #35483a;
  border: 1px solid #c9aa79;
  border-radius: 18px;
}

h1 {
  color: #d8bd91;
  text-align: center;
  font-size: 27px;
}

.intro {
  text-align: center;
  line-height: 1.8;
  font-size: 14px;
}

.question {
  margin: 30px 0;
}

.question p {
  line-height: 1.6;
  font-weight: 500;
}

label {
  display: block;
  margin: 10px 0;
  padding: 13px;
  background: #26372c;
  border: 1px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  line-height: 1.5;
  font-size: 14px;
}

label:has(input:checked) {
  border-color: #c9aa79;
  background: #405443;
}

input {
  accent-color: #c9aa79;
  margin-right: 8px;
}

button {
  display: block;
  margin: 25px auto 0;
  padding: 13px 25px;
  border: none;
  border-radius: 25px;
  background: #813e48;
  color: #fff8ee;
  font-family: inherit;
  font-size: 15px;
  cursor: pointer;
}

#result {
  display: none;
  text-align: center;
  line-height: 1.8;
  margin-top: 30px;
}

.result-card {
  padding: 22px;
  margin-top: 20px;
  background: #26372c;
  border: 1px solid #c9aa79;
  border-radius: 14px;
}

.result-icon {
  font-size: 38px;
}

.result-title {
  color: #d8bd91;
  font-size: 23px;
  margin: 10px 0;
}

.small {
  text-align: center;
  font-size: 12px;
  opacity: 0.8;
  line-height: 1.7;
}

a {
  display: block;
  margin-top: 28px;
  color: #d8bd91;
  text-align: center;
}
</style>
</head>

<body>

<div class="quiz">

  <h1>What kind of boyfriend are you? ♡</h1>

  <p class="intro">
    Now lets do some boyfriend quiz hehe
    Be honest. I might be judging your answers a little.
    <br>Good luck! ♡
  </p>

  <form id="quizForm">
    <div id="questions"></div>

    <p class="small">
      Choose the answer that feels most like you if it's not 100% accurate and all
    </p>

    <button type="submit">Reveal my boyfriend type ♡</button>
  </form>

  <div id="result">
    <p class="small">YOUR OFFICIAL BOYFRIEND PERSONALITY IS...</p>

    <div id="resultCards"></div>

    <p id="finalMessage"></p>

    <button onclick="restartQuiz()">Take the quiz again ♡</button>
  </div>

  <a href="../index.html">← Back to the calendar</a>

</div>

<script>
const questions = [
  {
    question: "1. Your girlfriend tells you she's had a terrible day. What do you do?",
    options: [
      { text: "Give her affection and remind her how loved she is.", type: "soft" },
      { text: "Remember what happened and find a way to cheer her up.", type: "thoughtful" },
      { text: "Try to make her laugh until she forgets about it.", type: "playful" },
      { text: "Listen to her and stay by her side until she's okay.", type: "reliable" }
    ]
  },
  {
    question: "2. What's your ideal date?",
    options: [
      { text: "A cosy evening, cuddles and lots of affection.", type: "soft" },
      { text: "Something carefully planned with little surprises.", type: "thoughtful" },
      { text: "An adventure full of random activities and lot of laughing.", type: "playful" },
      { text: "Something simple where we can just enjoy each other's company.", type: "reliable" }
    ]
  },
  {
    question: "3. How do you usually show someone you love them?",
    options: [
      { text: "I say it often and make sure they feel appreciated.", type: "soft" },
      { text: "I remember tiny details and do things that make them happy.", type: "thoughtful" },
      { text: "I tease them, joke around and make them smile.", type: "playful" },
      { text: "I show up consistently and keep my promises.", type: "reliable" }
    ]
  },
  {
    question: "4. Your girlfriend randomly sends you 'I miss you'. Your reaction?",
    options: [
      { text: "I MISS YOU MORE. Come here. ♡", type: "soft" },
      { text: "Send her something sweet that reminds her of me.", type: "thoughtful" },
      { text: "Reply with something ridiculous just to make her laugh.", type: "playful" },
      { text: "Tell her when we'll see each other next.", type: "reliable" }
    ]
  },
  {
    question: "5. What's your biggest strength in a relationship?",
    options: [
      { text: "I'm affectionate and emotionally expressive.", type: "soft" },
      { text: "I pay attention to the little things.", type: "thoughtful" },
      { text: "I bring fun and spontaneity into everything.", type: "playful" },
      { text: "I'm loyal and someone you can count on.", type: "reliable" }
    ]
  },
  {
    question: "6. You have a completely free afternoon together. What happens?",
    options: [
      { text: "We spend hours being affectionate and doing nothing.", type: "soft" },
      { text: "I've prepared a little surprise for us.", type: "thoughtful" },
      { text: "We start doing one thing and somehow end up doing five others.", type: "playful" },
      { text: "We relax together and enjoy having no plans.", type: "reliable" }
    ]
  },
  {
    question: "7. What's your reaction when your girlfriend gives you a handmade gift?",
    options: [
      { text: "I get genuinely emotional because it's so sweet.", type: "soft" },
      { text: "I keep it somewhere special and treasure every detail.", type: "thoughtful" },
      { text: "I act dramatic and excited because I'm obsessed with it.", type: "playful" },
      { text: "I appreciate the effort and make sure she knows it means a lot.", type: "reliable" }
    ]
  },
  {
    question: "8. Final questionnn, what do you hope your girlfriend feels when she's with you? (kinda difficult ik)",
    options: [
      { text: "Loved, cherished and never afraid to be affectionate.", type: "soft" },
      { text: "Special, understood and remembered.", type: "thoughtful" },
      { text: "Happy, carefree and able to be silly.", type: "playful" },
      { text: "Safe, respected and certain she can count on me.", type: "reliable" }
    ]
  }
];

const personalities = {
  soft: {
    icon: "♡",
    title: "The Soft-Hearted Angel",
    description: "Turns out you're the affectionate boyfriend. You love making your girlfriend feel wanted, appreciated and reassured. (Good good good!) You're probably the type to send random sweet messages and tiktoks just because you miss her. You have a soft spot, and you're not afraid to show it.",
    message: "You're not corny and even if you are I love you just like this. I love you! ♡"
  },

  thoughtful: {
    icon: "✉",
    title: "The Thoughtful Romantic",
    description: "Turns out you're the all-about-details boyfriend (not sure if you say it like that T0T). You remember the little things, notice what makes her happy (+100 good boy points) and find ways to make ordinary moments special without really trying. You might not always make grand gestures, but your love lives in the details.",
    message: "It's often the smallest things that mean the most. I love you! ♡"
  },

  playful: {
    icon: "✦",
    title: "The Playful Menace",
    description: "You're the funny, unpredictable boyfriend. Your favourite hobby is teasing and annoying your girlfriend (me) just because you can. Life with you is rarely boring.",
    message: "Please behave. Actually, never mind. I love you! ♡"
  },

  reliable: {
    icon: "☾",
    title: "The Steady One",
    description: "Turns out you're the dependable boyfriend. You believe love is more than just words: it's showing up for your lover, listening, respecting boundaries and keeping your promises. (especially pinky promises) You're someone who wants to build something meaningful, one day at a time. Something that will last forever.",
    message: "We LOVE some good Consistency hehe, I love you! ♡"
  }
};
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQC60lSBofZPQZc5eo5yJkdX2yZd4Hfx3AMmTLiyMWRNY9lWw7ZAYrfQ-nakbmIcFgTQ/exec";
  
const form = document.getElementById("quizForm");
const questionsArea = document.getElementById("questions");

questions.forEach((q, index) => {
  const section = document.createElement("div");
  section.className = "question";

  const title = document.createElement("p");
  title.textContent = q.question;
  section.appendChild(title);

  q.options.forEach((option, optionIndex) => {
    const label = document.createElement("label");

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "q" + index;
    radio.value = option.type;
    radio.required = true;

    label.appendChild(radio);
    label.appendChild(document.createTextNode(option.text));

    section.appendChild(label);
  });

  questionsArea.appendChild(section);
});

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const scores = {
    soft: 0,
    thoughtful: 0,
    playful: 0,
    reliable: 0
  };

  questions.forEach((q, index) => {
    const selected = form.querySelector(
      'input[name="q' + index + '"]:checked'
    );

    if (selected) {
      scores[selected.value]++;
    }
  });

  const highest = Math.max(...Object.values(scores));

  const winners = Object.keys(scores).filter(
    type => scores[type] === highest
  );

  const resultCards = document.getElementById("resultCards");
  resultCards.innerHTML = "";

  winners.forEach(type => {
    const personality = personalities[type];

    if (!personality) return;

    const card = document.createElement("div");
    card.className = "result-card";

    const icon = document.createElement("div");
    icon.className = "result-icon";
    icon.textContent = personality.icon;

    const title = document.createElement("h2");
    title.className = "result-title";
    title.textContent = personality.title;

    const description = document.createElement("p");
    description.textContent = personality.description;

    const message = document.createElement("p");
    message.style.color = "#d8bd91";
    message.textContent = personality.message;

    card.append(icon, title, description, message);
    resultCards.appendChild(card);
  });

  document.getElementById("finalMessage").textContent =
    winners.length > 1
    ? "You are a combination of these personalities! A little bit of everything. ♡"
    : "Well, well... that's your official boyfriend personality made by your wonderful girlfriend ♡";

  form.style.display = "none";
  document.getElementById("result").style.display = "block";

  window.scrollTo({ top: 0, behavior: "smooth" });
});

function restartQuiz() {
  form.reset();

  form.style.display = "block";
  document.getElementById("result").style.display = "none";

  window.scrollTo({ top: 0, behavior: "smooth" });
}

</script>

</body>
</html>
