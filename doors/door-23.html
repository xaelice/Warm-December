<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>December 23rd ♡</title>

  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #304b3d, #1c3027);
      color: #f8f1e6;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
      box-sizing: border-box;
    }

    .content {
      max-width: 550px;
      width: 100%;
      padding: 40px 25px;
      border: 1px solid rgba(212, 185, 142, 0.4);
      background: rgba(248, 241, 230, 0.06);
      border-radius: 6px;
    }

    .date {
      color: #d4b98e;
      letter-spacing: 4px;
      font-size: 12px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 42px;
      font-weight: normal;
      margin: 25px 0;
    }

    .message {
      font-family: 'Lora', serif;
      font-size: 15px;
      line-height: 2;
      color: #f1e7d7;
    }

    .decoration {
      color: #d4b98e;
      letter-spacing: 8px;
      margin: 30px 0;
    }

    a {
      color: #d4b98e;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
    }

    a:hover {
      color: #fff;
    }
  </style>
</head>

<body>
  <main class="content">
    <p class="date">December 23rd</p>

    <h1>A little beginning ♡</h1>

    <div class="decoration">✦ ✧ ✦</div>

    <p class="message">
      Your first little surprise goes here.
      <br><br>
      I'll put something special here for you soon ( •̯́ ₃ •̯̀).
    </p>

    <div class="decoration">♡ ❄ ♡</div>

    <a href="../index.html">← Back to the calendar</a>
  </main>
</body>
</html>
